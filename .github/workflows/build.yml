name: Build Extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build web client
        run: pnpm --filter neutab-web-client build

      - name: Build web server
        run: pnpm --filter neutab-web-server build

      - name: Package (Chrome)
        run: pnpm package

      - name: Package (Firefox)
        run: pnpm package:firefox

      - name: Upload Chrome Package
        uses: actions/upload-artifact@v4
        with:
          name: NeuTab-chrome
          path: build/chrome-mv3-prod/

      - name: Upload Firefox Package
        uses: actions/upload-artifact@v4
        with:
          name: NeuTab-firefox
          path: build/firefox-mv3-prod/
