packages:
  - "packages/*"
  - "webserver/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "better-sqlite3": true
  "esbuild": true
  "less": true
  "lmdb": true
  "msgpackr-extract": true
  "sharp": true

# 为旧构建工具隔离可选适配器依赖，应用仍使用 React 19。
packageExtensions:
  # 避免 Vite 解析到 Plasmo 内部使用的旧 esbuild。
  "vite@8.3.5":
    dependencies:
      esbuild: "^0.28.2"
  # consolidate 的模板 renderer 仍依赖 React 18 的 createFactory。
  "@plasmohq/parcel-transformer-vue@0.5.0":
    dependencies:
      react: "^18.3.1"
      react-dom: "^18.3.1"
  # htmlnano 使用 SVGO 3；Parcel 自身的 SVG 优化器继续使用 SVGO 2。
  "htmlnano@2.1.5":
    dependencies:
      svgo: "^3.3.5"
